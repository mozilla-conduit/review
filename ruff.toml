line-length = 88

target-version = "py310"

[lint]
select = [
    "C",
    "E",
    "F",
    "W",
    "B",
    "B9",
    "I",
    "UP006",
    "UP007",
    "UP035",
    "UP037",
    "UP045",
]
ignore = ["B006", "B904", "C901", "E203", "E501"]
exclude = [
    ".hg",
    ".git",
    "__pycache__",
    ".cache",
    # Ignore test data, which is annoying to properly format.
    "tests/data/",
]

[lint.isort]
split-on-trailing-comma = true
